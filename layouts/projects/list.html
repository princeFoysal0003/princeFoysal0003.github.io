{{ define "main" }}
<h1>Projects</h1>

  {{ range .Pages.ByDate.Reverse }}
  <div class="list-item">
	<div class="item-info">
		<!-- <em class="type">{{ .Params.type}}</em><br> -->
		<a href="{{ .RelPermalink }}">{{ .Title }}</a><br>
		<em>Authors: {{ .Params.authors }}</em><br>
		Date: {{.Date.Format "Jan 02, 2006"}}
	</div>

  </div>
  {{ end }}

{{ end }}
